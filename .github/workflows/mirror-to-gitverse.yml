name: Mirror to GitVerse
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
  schedule:
    - cron: '27 3 * * *'
permissions:
  contents: read
concurrency:
  group: compliance-gitverse-mirror
  cancel-in-progress: false
jobs:
  mirror:
    name: Mirror GitHub branches and tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mirror and verify main
        env:
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          test -n "$GV_TOKEN" || { echo "::error::GITVERSE_TOKEN missing"; exit 1; }
          cat > "$RUNNER_TEMP/compliance-gitverse-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'arvectum' ;;
            *Password*) printf '%s\n' "$GV_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/compliance-gitverse-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/compliance-gitverse-askpass.sh"
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" repository.git
          cd repository.git
          git remote add gitverse https://gitverse.ru/arvectum/compliance.git
          for attempt in 1 2 3 4 5; do
            if git push --force --prune gitverse \
              'refs/heads/*:refs/heads/*' \
              'refs/tags/*:refs/tags/*' > "$RUNNER_TEMP/compliance-mirror.log" 2>&1; then
              gh_sha="$(git rev-parse refs/heads/main)"
              gv_sha="$(git ls-remote gitverse refs/heads/main | cut -f1)"
              test "$gh_sha" = "$gv_sha" || { echo "::error::Mirror SHA mismatch"; exit 1; }
              echo "Mirrored main: $gv_sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::GitVerse push failed (attempt $attempt/5)"
            if test "$attempt" -lt 5; then sleep 10; fi
          done
          echo "::error::GitVerse push failed after five attempts"
          exit 1
