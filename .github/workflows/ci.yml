name: Compliance CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install pinned Data Platform runtime contract
        run: python -m pip install --no-deps 'git+https://github.com/arvectum2/data-platform.git@d341731664bdc4bc6bb5e8fdeef3df00706c72bd'
      - name: Spec Kit feature gate
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/001-foundation-and-static-scan
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: bash .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - run: ruff check src tests
      - run: pytest -q
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Browser worker policy tests (offline)
        run: node --test browser-worker/test/policy.test.mjs
      - name: Spec Kit browser feature gate
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/002-browser-consent-observation
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: bash .specify/scripts/bash/check-prerequisites.sh --json --require-spec --require-tasks
      - run: arvectum-compliance scan-html tests/fixtures/good.html --url https://example.com/contact > /tmp/compliance.json
      - run: python -c 'import json; d=json.load(open("/tmp/compliance.json")); assert d["schema_version"]=="1.0" and not d["findings"]'
