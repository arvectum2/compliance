name: Compliance Kernel Egress E2E

on:
  push:
    paths:
      - 'infra/egress/**'
      - 'scripts/run-egress-kernel-*.sh'
      - 'tests/test_egress_kernel_docker.py'
      - '.github/workflows/kernel-egress-e2e.yml'
  pull_request:
    paths:
      - 'infra/egress/**'
      - 'scripts/run-egress-kernel-*.sh'
      - 'tests/test_egress_kernel_docker.py'
      - '.github/workflows/kernel-egress-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Build temporary private-network gateway policy container
        run: |
          docker build -f infra/egress/Dockerfile \
            -t arvectum/compliance-egress-probe:eg003-lite infra/egress
      - name: Verify kernel policy despite direct socket attempts
        env:
          COMPLIANCE_FIREWALL_E2E: '1'
        run: pytest -q tests/test_egress_kernel_docker.py
