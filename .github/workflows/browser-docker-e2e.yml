name: Compliance Browser Docker E2E
on:
  push:
    paths:
      - 'scripts/run-egress-attested-verified.sh'
      - 'src/arvectum_compliance/service/attestor_keys.py'
      - 'src/arvectum_compliance/service/verified_root.py'
      - 'tests/test_verified_root_docker.py'
      - 'src/arvectum_compliance/service/attested_ipc.py'
      - 'src/arvectum_compliance/service/attested_gateway.py'
      - 'src/arvectum_compliance/adapters/attested_bridge.py'
      - 'scripts/run-egress-attested-fixture.sh'
      - 'tests/test_attested_docker.py'
      - 'infra/egress/Dockerfile.gateway'
      - 'infra/egress/entrypoint.sh'
      - 'infra/egress/nftables.nft'
      - 'scripts/run-egress-stdio-gateway.sh'
      - 'src/arvectum_compliance/service/**'
      - 'src/arvectum_compliance/adapters/isolated_bridge.py'
      - 'src/arvectum_compliance/adapters/browser_fixture.py'
      - 'tests/test_isolated_gateway_docker.py'
      - 'browser-worker/**'
      - 'scripts/run-browser-*.sh'
      - 'tests/test_browser_docker.py'
      - 'tests/test_bridge_docker.py'
      - 'src/arvectum_compliance/adapters/fixture_bridge.py'
      - 'src/arvectum_compliance/core/browser_evidence.py'
      - '.github/workflows/browser-docker-e2e.yml'
  pull_request:
    paths:
      - 'scripts/run-egress-attested-verified.sh'
      - 'src/arvectum_compliance/service/attestor_keys.py'
      - 'src/arvectum_compliance/service/verified_root.py'
      - 'tests/test_verified_root_docker.py'
      - 'src/arvectum_compliance/service/attested_ipc.py'
      - 'src/arvectum_compliance/service/attested_gateway.py'
      - 'src/arvectum_compliance/adapters/attested_bridge.py'
      - 'scripts/run-egress-attested-fixture.sh'
      - 'tests/test_attested_docker.py'
      - 'infra/egress/Dockerfile.gateway'
      - 'infra/egress/entrypoint.sh'
      - 'infra/egress/nftables.nft'
      - 'scripts/run-egress-stdio-gateway.sh'
      - 'src/arvectum_compliance/service/**'
      - 'src/arvectum_compliance/adapters/isolated_bridge.py'
      - 'src/arvectum_compliance/adapters/browser_fixture.py'
      - 'tests/test_isolated_gateway_docker.py'
      - 'browser-worker/**'
      - 'scripts/run-browser-*.sh'
      - 'tests/test_browser_docker.py'
      - 'tests/test_bridge_docker.py'
      - 'src/arvectum_compliance/adapters/fixture_bridge.py'
      - 'src/arvectum_compliance/core/browser_evidence.py'
      - '.github/workflows/browser-docker-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Install offline core and browser client
        run: |
          python -m pip install -e '.[dev]'
          npm ci --prefix browser-worker --ignore-scripts --no-audit --no-fund
      - name: Pull SHA-pinned Playwright image
        run: docker pull mcr.microsoft.com/playwright@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      - name: Build nftables-protected Python gateway
        run: |
          docker build -f infra/egress/Dockerfile.gateway -t arvectum/compliance-egress-runtime:eg003b .
      - name: Docker security and two-container browser E2E
        env:
          COMPLIANCE_DOCKER_E2E: '1'
        run: pytest -q tests/test_browser_docker.py tests/test_bridge_docker.py tests/test_isolated_gateway_docker.py tests/test_attested_docker.py tests/test_verified_root_docker.py
